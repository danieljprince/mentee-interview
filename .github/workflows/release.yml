name: Release & Push to ECR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Optional version (e.g. 1.0.0) to roll back :latest to"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 030454160336.dkr.ecr.eu-west-2.amazonaws.com
  ECR_REPOSITORY: mentee-interview-registry
  ECS_CLUSTER: mentee-interview-cluster
  ECS_SERVICE: mentee-interview-service

jobs:
  release-and-publish:
    name: Test, Build, Release & Push Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests (stops release on failure)
        run: python -m unittest discover -v

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Rollback to previous version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_version != '' }}
        env:
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
        run: |
          echo "Rolling back :latest to version ${ROLLBACK_VERSION}..."
          docker pull "${IMAGE_URI}:${ROLLBACK_VERSION}"
          OUTPUT=$(docker run --rm "${IMAGE_URI}:${ROLLBACK_VERSION}" --version)
          echo "Verified rollback image output: ${OUTPUT}"
          docker tag "${IMAGE_URI}:${ROLLBACK_VERSION}" "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:latest"
          echo "Successfully rolled back :latest to ${ROLLBACK_VERSION}"
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${AWS_REGION}" || echo "ECS service not yet created or update skipped"

      - name: Determine next release version
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_version == '' }}
        id: semver
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            VERSION_WITHOUT_V="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"
            PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved next version: ${NEXT_VERSION} (tag: v${NEXT_VERSION})"

      - name: Build, verify, and tag Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_version == '' }}
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build \
            --build-arg APP_VERSION="${VERSION}" \
            -t "${ECR_REPOSITORY}:${VERSION}" \
            -t "${ECR_REPOSITORY}:latest" \
            -t "${IMAGE_URI}:${VERSION}" \
            -t "${IMAGE_URI}:latest" \
            .

          # Verify container outputs the exact matching version
          OUTPUT=$(docker run --rm "${ECR_REPOSITORY}:${VERSION}" --version)
          echo "Container output: ${OUTPUT}"
          if [[ "${OUTPUT}" != *"${VERSION}"* ]]; then
            echo "Error: Container app version output ('${OUTPUT}') does not match expected version '${VERSION}'"
            exit 1
          fi

      - name: Push Docker image to Amazon ECR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_version == '' }}
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker push "${IMAGE_URI}:${VERSION}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy new version to Amazon ECS Fargate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_version == '' }}
        run: |
          echo "Triggering ECS Fargate rolling deployment for ${ECS_CLUSTER}/${ECS_SERVICE}..."
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${AWS_REGION}" || echo "ECS service '${ECS_SERVICE}' not found yet - create it in ECS console to enable auto-deploy."

      - name: Create GitHub Release and Tag
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_version == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: Release ${{ steps.semver.outputs.tag }}
          generate_release_notes: true
